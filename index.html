<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRONOS FID • Mantenimiento Temporal</title>

    <!-- Favicons & App Icons -->
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="./CRONOS_FID_icon.png">
    <link rel="shortcut icon" href="./favicon.ico">

    <!-- Meta Tags -->
    <meta name="description" content="CRONOS FID se encuentra temporalmente en mantenimiento y mejora continua.">
    <meta name="robots" content="noindex, nofollow">

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #ffffff;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
        }

        .maintenance-container {
            width: 100%;
            max-width: 580px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .brand-visual {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-logo {
            max-height: 68px;
            max-width: 220px;
            width: auto;
            object-fit: contain;
            border-radius: 8px;
        }

        .icon-badge {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            background: #fff7ed;
            border: 1px solid #ffedd5;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ea580c;
            box-shadow: 0 10px 25px -5px rgba(234, 88, 12, 0.12), 0 8px 10px -6px rgba(234, 88, 12, 0.08);
            margin: 0 auto;
        }

        .icon-badge svg {
            width: 36px;
            height: 36px;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 9999px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            color: #475569;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.02em;
            margin-bottom: 24px;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #f59e0b;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.6;
                transform: scale(1.15);
            }
        }

        .title {
            font-size: clamp(1.65rem, 4vw, 2.2rem);
            font-weight: 700;
            line-height: 1.25;
            color: #0f172a;
            letter-spacing: -0.025em;
            margin-bottom: 16px;
        }

        .subtitle {
            font-size: clamp(1rem, 2.5vw, 1.125rem);
            line-height: 1.6;
            color: #64748b;
            font-weight: 400;
            max-width: 480px;
            margin: 0 auto 36px auto;
        }

        .action-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, #ff5e00 0%, #e04800 100%);
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 12px;
            box-shadow: 0 10px 20px -3px rgba(255, 94, 0, 0.35), 0 4px 6px -4px rgba(255, 94, 0, 0.2);
            transition: all 0.22s ease-in-out;
            cursor: pointer;
            border: none;
            outline: none;
        }

        .action-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 24px -3px rgba(255, 94, 0, 0.45), 0 6px 8px -4px rgba(255, 94, 0, 0.25);
            background: linear-gradient(135deg, #ff6c14 0%, #eb4f05 100%);
        }

        .action-button:active {
            transform: translateY(0);
            box-shadow: 0 4px 8px -2px rgba(255, 94, 0, 0.3);
        }

        .action-button svg {
            width: 18px;
            height: 18px;
            transition: transform 0.2s ease;
        }

        .action-button:hover svg {
            transform: translateX(3px);
        }

        .footer-note {
            margin-top: 48px;
            font-size: 12px;
            color: #94a3b8;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            font-weight: 500;
        }

        @media (max-width: 480px) {
            .maintenance-container {
                padding: 12px 6px;
            }
            .action-button {
                width: 100%;
                padding: 15px 24px;
            }
        }
    </style>
</head>

<body>
    <main class="maintenance-container" role="main">
        <!-- Elemento visual opcional -->
        <div class="brand-visual">
            <img src="./cronos_fid_final.png" alt="CRONOS FID" class="brand-logo" onerror="this.style.display='none'; document.getElementById('backup-badge').style.display='flex';">
            <div id="backup-badge" class="icon-badge" style="display: none;">
                <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M11.42 15.17L17.25 21A2.652 2.652 0 0021 17.25l-5.877-5.877M11.42 15.17l2.496-3.03c.317-.384.74-.626 1.208-.766M11.42 15.17l-4.655 5.653a2.548 2.548 0 11-3.586-3.586l6.837-5.63m5.108-.233c.55-.164 1.163-.188 1.743-.14a4.5 4.5 0 004.486-6.32l-3.27 3.27a1.5 1.5 0 01-2.122-2.122l3.27-3.27a4.5 4.5 0 00-6.32 4.486c.048.58.024 1.193-.14 1.743" />
                </svg>
            </div>
        </div>

        <div class="status-pill">
            <span class="status-indicator"></span>
            <span>Mantenimiento y Actualización</span>
        </div>

        <h1 class="title">Estamos trabajando para darte una mejor experiencia</h1>

        <p class="subtitle">CRONOS FID se encuentra temporalmente en mantenimiento y mejora continua.</p>

        <a href="https://win-cfd-gh.github.io/CRONOS/" class="action-button" title="Ir a la nueva versión">
            <span>Ir a la nueva versión</span>
            <svg fill="none" viewBox="0 0 24 24" stroke-width="2.2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
            </svg>
        </a>

        <div class="footer-note">
            CRONOS FID • Versión JELI v5.0.0 • WIN 2026
        </div>
    </main>
</body>

</html>
